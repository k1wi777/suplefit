# SupleFit API — Railway Config as Code
# En el servicio API de Railway:
#   - Root Directory: apps/api
#   - Config file path: /apps/api/railway.toml  (ruta absoluta desde la raíz del repo)
#   - Vincular variables MySQL → ver railway.env.example

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build"
watchPatterns = ["/apps/api/**"]

[deploy]
preDeployCommand = "sh scripts/railway-migrate.sh"
startCommand = "node dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
